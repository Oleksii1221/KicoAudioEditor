name: Release Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        default: "0.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build portable bundle and installer
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) { $version = "${{ github.ref_name }}".TrimStart("v") }
          packaging\windows\build-installer.ps1 -Version $version
          Compress-Archive -Path dist\KAE\* -DestinationPath "dist\KAE-$version-windows-x64-portable.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/installer/*.exe
            dist/*.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm libxcb-cursor0 || true
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64 || true
          sudo gem install --no-document fpm
          curl -L -o appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/appimagetool
      - name: Build Linux packages
        run: |
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#v}"; fi
          export KAE_VERSION="$version"
          export APPIMAGE_EXTRACT_AND_RUN=1
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          bash packaging/linux/build-appimage.sh
          bash packaging/linux/fpm-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.AppImage
            dist/packages/*.deb
            dist/packages/*.rpm

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
