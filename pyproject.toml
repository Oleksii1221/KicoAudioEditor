[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kae-audio-editor"
version = "0.1.0"
description = "KAE is a pink anime-themed desktop audio metadata editor."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kico Audio Lab" }]
dependencies = [
    "mutagen>=1.47.0",
    "PySide6>=6.7.0",
    "Pillow>=10.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
    "pyinstaller>=6.8.0",
]

[project.scripts]
kae = "kae.app:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kae = ["assets/images/*.png", "assets/icons/*.ico", "assets/styles/*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
